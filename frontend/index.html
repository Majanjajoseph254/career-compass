<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerCompass AI</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">CareerCompass AI</div>
            <div class="nav-links">
                <a href="#home" class="active">Home</a>
                <a href="#dashboard">Dashboard</a>
                <a href="#about">About</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="home" class="hero-section">
            <h1>Find Your Perfect Career Path</h1>
            <p>Upload your resume and let AI guide your career journey</p>
            <div class="upload-container" id="upload-area">
                <div class="upload-box">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <h3>Drag & Drop Your Resume</h3>
                    <p>or</p>
                    <button class="upload-btn">Browse Files</button>
                    <input type="file" id="file-input" accept=".pdf,.docx,.txt" hidden>
                </div>
            </div>
        </section>

        <section id="dashboard" class="dashboard-section hidden">
            <h2>Your Career Analysis Dashboard</h2>
            <div class="dashboard-grid">
                <div class="chart-container">
                    <h3>Skills Match</h3>
                    <canvas id="skills-chart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Industry Fit</h3>
                    <canvas id="industry-chart"></canvas>
                </div>
                <div class="recommendations">
                    <h3>Career Recommendations</h3>
                    <div id="career-recommendations"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 CareerCompass AI. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/charts.js"></script>
</body>
</html>
